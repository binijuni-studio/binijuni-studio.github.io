<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="BiniJuni Studio 게임 소개와 고객지원 안내">
  <title>BiniJuni Studio</title>
  <link rel="canonical" href="https://binijuni-studio.github.io/">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fffaf3; color: #503d36; font: 16px/1.6 system-ui, -apple-system, sans-serif; }
    main { width: min(440px, calc(100% - 40px)); margin: 12vh auto; }
    h1 { margin: 0; font-size: 28px; }
    p { margin: 8px 0 28px; color: #756057; }
    nav { display: grid; gap: 12px; }
    a { display: block; padding: 18px 20px; border: 1px solid #e6d7cd; border-radius: 14px; background: white; color: inherit; text-decoration: none; font-weight: 650; }
    a:hover { border-color: #795b95; background: #f5edf9; }
    a:focus-visible { outline: 3px solid #795b95; outline-offset: 4px; }
    small { display: block; margin-top: 3px; color: #756057; font-size: 14px; font-weight: 400; }
  </style>
</head>
<body>
  <main>
    <h1>BiniJuni Studio</h1>
    <p>게임 소개 · 고객지원</p>
    <nav aria-label="게임 페이지">
      <a href="nyangnyangbox/">냥냥 박스<small lang="en">Nyang Nyang Box</small></a>
      <a href="pacelstack/">차곡차곡 택배<small lang="en">Parcel Stack</small></a>
      <a href="stuntbiketour/" lang="en">Stunt Bike Tour</a>
    </nav>
  </main>
</body>
</html>
